name: Sync upstream

# Keeps this fork mergeable with the upstream project:
#   - every 6 hours (and on demand) fetch https://github.com/Slaker19/webkvm
#   - merge upstream/main into this branch, preserving the zh localization
#   - auto-resolve fork-owned files + docs nav + CHANGELOG/AGENTS/.env/CI bits
#   - fill new English keys into messages.zh as temporary fallbacks
#   - open/refresh an issue with the translation backlog
#   - if source-code conflicts cannot be auto-resolved, abort cleanly and open
#     an issue with the file list and local resolution instructions.
#
# The workflow pushes with the repository-scoped GITHUB_TOKEN; grant the
# workflow "Read and write permissions" under Settings → Actions → General.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only test the merge (never push)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write   # needed to dispatch the localized build after a sync push

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  UPSTREAM_URL: https://github.com/Slaker19/webkvm.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: Merge upstream and keep zh localization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (prettier + checker)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Configure git identity
        run: |
          git config user.name "webkvm-zh sync bot"
          git config user.email "webkvm-zh@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        shell: bash
        run: |
          set +e
          export REPORT_DIR="${RUNNER_TEMP}"
          export UPSTREAM_URL UPSTREAM_BRANCH
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then export DRY_RUN=1; else export DRY_RUN=0; fi
          bash scripts/sync/sync-upstream.sh
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fill new zh keys and verify localization
        if: steps.sync.outputs.rc == '0' && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}"
          python3 scripts/sync/fill-missing-zh.py
          ( cd frontend && npx prettier --write src/lib/i18n.svelte.js )
          bash scripts/sync/verify-localization.sh
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): fill new upstream zh keys with English fallbacks (translate later)"
          fi

      - name: Push to main
        if: steps.sync.outputs.rc == '0' && inputs.dry_run != true
        run: git push origin HEAD:main

      # Events produced by GITHUB_TOKEN do not start other workflows, so the
      # localized-release build is dispatched explicitly instead of relying on
      # its `on: push` trigger.
      - name: Trigger localized build
        if: steps.sync.outputs.rc == '0' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-zh-release.yml --ref main

      - name: Open or refresh conflict issue
        if: steps.sync.outputs.rc == '2'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="上游同步冲突：需要手动解决"
          body="${RUNNER_TEMP}/.sync-upstream-report.md"
          [ -f "$body" ] || printf '（没有生成报告）\n' > "$body"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: Close resolved conflict issue
        if: steps.sync.outputs.rc == '0' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="上游同步冲突：需要手动解决"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "上游合并已恢复（自动同步成功），此冲突已解决。"
          fi

      - name: Open or refresh translation backlog issue
        if: steps.sync.outputs.rc == '0' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/translation-backlog.md"
          title="翻译待办：上游同步带来的新键与新文档"
          if [ ! -f "$f" ]; then
            num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "翻译待办已清空，感谢！"
            fi
            exit 0
          fi
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$f"
          else
            gh issue create --title "$title" --body-file "$f"
          fi

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report
          path: |
            ${{ runner.temp }}/.sync-upstream-report.md
            ${{ runner.temp }}/translation-backlog.md
            ${{ runner.temp }}/sync-conflicts.txt
            ${{ runner.temp }}/sync-unresolved.txt
            ${{ runner.temp }}/sync-resolved.txt
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Upstream sync"
            echo
            cat "${RUNNER_TEMP}/.sync-upstream-report.md" 2>/dev/null || echo "no report"
            echo
            echo "## Translation backlog"
            echo
            cat "${RUNNER_TEMP}/translation-backlog.md" 2>/dev/null || echo "none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on fatal error
        if: steps.sync.outputs.rc != '0' && steps.sync.outputs.rc != '2'
        run: exit 1
